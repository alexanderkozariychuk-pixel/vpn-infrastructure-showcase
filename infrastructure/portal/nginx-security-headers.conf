# /etc/nginx/conf.d/sovrn-security-headers.conf on the portal host.
#
# At http level, so every server block inherits it — as long as no server or
# location block declares an add_header of its own (nginx then drops the
# inherited ones for that block). The portal's site has none; keep it so.
#
# Also on the host, in nginx.conf: `server_tokens off;` (it was `build`,
# which put the exact nginx version in every response).

# HTTPS only, for a year. No includeSubDomains: n1.sov3r3ign.com is the VPN
# endpoint, not a web site.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# A partial CSP: the pages use inline scripts and onclick handlers, so
# script-src cannot be locked down without rewriting them. These directives
# break nothing that exists and close framing, <base> hijacking, plugins,
# and forms posting elsewhere. Payment leaves by location.href, not a form.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
