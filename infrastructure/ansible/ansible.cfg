# Run everything from this directory: ansible.cfg is read from the current
# directory first, and the paths below are relative to it.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# The first connection to a host must be checked against a fingerprint you
# compared yourself (the provider's console, or `ssh-keyscan` from a second
# network). The July setup turned this off; it stays on.
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml

[ssh_connection]
pipelining = True
