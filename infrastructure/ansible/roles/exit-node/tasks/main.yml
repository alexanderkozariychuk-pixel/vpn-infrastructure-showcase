---
- name: Install Xray (official script)
  shell: bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
  args:
    creates: /usr/local/bin/xray

- name: Ensure Xray binary is present
  stat:
    path: /usr/local/bin/xray
  register: xray_binary

- name: Fail if Xray not installed
  fail:
    msg: "Xray installation failed"
  when: not xray_binary.stat.exists

- name: Generate Reality keys
  shell: /usr/local/bin/xray x25519
  register: reality_keys
  changed_when: false

- name: Set Reality private key
  set_fact:
    reality_private_key: "{{ reality_keys.stdout_lines[0].split(': ')[1] }}"

- name: Set Reality public key
  set_fact:
    reality_public_key: "{{ reality_keys.stdout_lines[1].split(': ')[1] }}"

- name: Generate UUID for Moldova inbound
  shell: /usr/local/bin/xray uuid
  register: uuid
  changed_when: false

- name: Set UUID fact
  set_fact:
    client_uuid: "{{ uuid.stdout }}"

- name: Save generated values to file (for reference)
  copy:
    content: |
      reality_public_key: {{ reality_public_key }}
      client_uuid: {{ client_uuid }}
      short_id: {{ xray_short_id }}
    dest: /etc/xray-credentials.txt
    mode: 0600

- name: Create Xray config directory
  file:
    path: /usr/local/etc/xray
    state: directory
    mode: 0755

- name: Deploy Xray config
  template:
    src: config.json.j2
    dest: /usr/local/etc/xray/config.json
    mode: 0644
  notify: restart xray

- name: Enable and start Xray
  systemd:
    name: xray
    enabled: yes
    state: started

- name: Allow inbound port in UFW
  ufw:
    rule: allow
    port: "{{ xray_inbound_port }}"
    proto: tcp