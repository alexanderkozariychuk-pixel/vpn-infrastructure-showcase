---
# ufw owns INPUT. On an entry FORWARD stays ACCEPT: what it forwards is
# decided by its own rules (awg0 PostUp, SOVRN-TRIAL) and by policy routing.
# An exit forwards only what its link interfaces accept (group_vars/exit).
- name: Forward policy
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="{{ common_ufw_forward_policy }}"'
  notify: Reload ufw

# SSH is allowed before ufw is enabled, never after: the other order cuts the
# session that is doing the enabling.
- name: SSH allowed
  community.general.ufw:
    rule: allow
    port: "{{ common_ssh_port | string }}"
    proto: tcp
    comment: ssh

- name: Incoming denied by default, ufw on
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
