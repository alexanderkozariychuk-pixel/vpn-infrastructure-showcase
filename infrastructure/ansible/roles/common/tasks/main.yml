---
- name: Fix apt sources for Beget RU servers
  when: "'bridge' in group_names"
  block:
    - name: Clear sources.list
      copy:
        content: ""
        dest: /etc/apt/sources.list
        mode: 0644

    - name: Write correct ubuntu.sources for Beget
      copy:
        content: |
          Types: deb
          URIs: http://public-mirrors.beget.ru/apt/ru.archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://public-mirrors.beget.ru/apt/ru.archive.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/ubuntu.sources
        mode: 0644

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - ufw
      - iptables
      - net-tools
      - software-properties-common
      - python3
    state: present

- name: Create a new user
  user:
    name: "{{ new_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present

- name: Grant passwordless sudo to new user
  copy:
    content: "{{ new_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ new_user }}"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Add SSH public key for the new user
  authorized_key:
    user: "{{ new_user }}"
    key: "{{ ssh_public_key }}"
    state: present

- name: Disable root login via SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart ssh

- name: Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart ssh

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Allow SSH before enabling UFW
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Configure UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Allow specific ports in UFW
  ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  ufw:
    state: enabled
