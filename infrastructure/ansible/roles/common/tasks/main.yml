---
# NOTE: this node uses AmneziaWG's own iptables PostUp/PostDown rules +
# iptables-persistent for firewall/NAT (see roles/amneziawg). UFW manages the
# same iptables chains via its own abstraction and the two packages actively
# conflict at the apt level (installing iptables-persistent removes ufw).
# So: no UFW here. Basic exposure is limited by only the AWG role opening
# the tunnel port, plus SSH; there is no separate ufw firewall layer on
# AmneziaWG nodes. If a bare (non-AWG) node needs a firewall later, add UFW
# there via a distinct role/flag, not here.

- name: Wait for apt/dpkg lock to be free
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && \
         ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 5
    done
    echo "timed out waiting for dpkg lock" >&2
    exit 1
  changed_when: false

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - iptables
      - software-properties-common
      - python3
    state: present

- name: Create a new user
  user:
    name: "{{ new_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present

- name: Grant passwordless sudo to new user
  copy:
    content: "{{ new_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ new_user }}"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Add SSH public key for the new user
  authorized_key:
    user: "{{ new_user }}"
    key: "{{ ssh_public_key }}"
    state: present

# --- SSH socket-activation fix (Ubuntu 24.04+/26.04) ---
- name: Check whether ssh.socket exists/active
  ansible.builtin.systemd:
    name: ssh.socket
  register: ssh_socket_state
  ignore_errors: true

- name: Disable ssh.socket (socket activation)
  ansible.builtin.systemd:
    name: ssh.socket
    state: stopped
    enabled: false
  when: ssh_socket_state.status.ActiveState | default('') == 'active'

- name: Ensure classic ssh.service is enabled and running
  ansible.builtin.systemd:
    name: ssh.service
    state: started
    enabled: true

# --- SSH hardening: OPT-IN, run only via -e ssh_hardening=true ---
- name: Harden SSH (disable root login + password auth)
  when: ssh_hardening | default(false) | bool
  block:
    - name: Disable root login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: restart ssh
    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: restart ssh

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
