---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - ufw
      - iptables
      - net-tools
      - software-properties-common
      - expect        
      - python3      
    state: present

- name: Create a new user
  user:
    name: "{{ new_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present

- name: Add SSH public key for the new user
  authorized_key:
    user: "{{ new_user }}"
    key: "{{ ssh_public_key }}"
    state: present

- name: Disable root login via SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart ssh

- name: Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart ssh

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Configure UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Allow specific ports in UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  ufw:
    state: enabled
    policy: allow
  notify: enable ufw

handlers:
  - name: restart ssh
    service:
      name: ssh
      state: restarted
  - name: enable ufw
    ufw:
      state: enabled
