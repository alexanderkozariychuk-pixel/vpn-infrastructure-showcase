---
# Only on a host with no swap at all; an existing swap file or partition is
# left as it is. Each step needs the previous one to have happened, so in
# check mode the block only reports.
- name: Swap would be created
  ansible.builtin.debug:
    msg: "no swap: a real run creates /swapfile, {{ common_swap_mb }} MB"
  when:
    - ansible_facts['swaptotal_mb'] | int == 0
    - ansible_check_mode

- name: Swap file
  when:
    - ansible_facts['swaptotal_mb'] | int == 0
    - not ansible_check_mode
  block:
    - name: Allocate /swapfile
      ansible.builtin.command: fallocate -l {{ common_swap_mb }}M /swapfile
      args:
        creates: /swapfile

    - name: Swap file is root-only
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format and enable
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      changed_when: true

    - name: Swap survives reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0
