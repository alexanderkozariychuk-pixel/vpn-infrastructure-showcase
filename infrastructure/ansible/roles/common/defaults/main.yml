---
# admin_user, admin_ssh_pubkey, monitor_from, sovmon_ssh_pubkey come from the
# inventory; there are no safe defaults for them.
common_admin_sudoers_file: "90-{{ admin_user }}"
common_timezone: Etc/UTC
# systemd-timesyncd or chrony. The two exclude each other in apt: installing
# one removes the other. exit-2 was set up with chrony (group_vars/exit).
common_time_service: systemd-timesyncd
common_swap_mb: 2048
common_ssh_port: 22
# ufw's FORWARD policy. ACCEPT on an entry (roles/common/tasks/firewall.yml);
# an exit sets DROP in group_vars/exit.
common_ufw_forward_policy: ACCEPT
common_f2b_maxretry: 6
common_f2b_bantime: 600

# What `sshd -T` must report (lowercase keywords, as sshd prints them).
common_sshd_want:
  permitrootlogin: "no"
  passwordauthentication: "no"
  kbdinteractiveauthentication: "no"
  pubkeyauthentication: "yes"
  x11forwarding: "no"

# What a filled-in inventory value looks like. The example's placeholders
# ("ssh-ed25519 AAAA...", "<am1-address>") must not pass.
common_pubkey_re: '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}( \S+)?$'
common_addr_re: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'

# Removed if present (image-leftovers.yml): seen to misbehave on a node.
common_unwanted_packages:
  - fwupd

# Removed if present (no-containers.yml). Both Ubuntu's and Docker's own
# package names.
common_container_packages:
  - docker.io
  - docker-ce
  - docker-ce-cli
  - containerd
  - containerd.io
  - docker-compose
  - docker-compose-v2
  - docker-compose-plugin
  - docker-buildx
  - docker-buildx-plugin
  - python3-docker
  - python3-dockerpty
  - runc
