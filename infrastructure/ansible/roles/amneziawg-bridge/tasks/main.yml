---
- name: Create AWG config directory
  file:
    path: /etc/amnezia/amneziawg
    state: directory
    mode: 0700

- name: Copy AWG binary
  copy:
    src: /tmp/awg
    dest: /usr/bin/awg
    mode: 0755

- name: Copy AWG-quick binary
  copy:
    src: /tmp/awg-quick
    dest: /usr/bin/awg-quick
    mode: 0755

- name: Copy AWG systemd unit
  copy:
    src: /tmp/awg-quick@.service
    dest: /lib/systemd/system/awg-quick@.service
    mode: 0644

- name: Install DKMS and build tools
  apt:
    name:
      - dkms
      - build-essential
      - "linux-headers-{{ ansible_kernel }}"
    state: present

- name: Copy AWG kernel module source
  copy:
    src: /tmp/amneziawg-module.tar.gz
    dest: /tmp/amneziawg-module.tar.gz

- name: Extract AWG module source
  unarchive:
    src: /tmp/amneziawg-module.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Create DKMS source directory
  file:
    path: /usr/src/amneziawg-1.0.20241112
    state: directory
    mode: 0755

- name: Copy module source files
  shell: cp -r /tmp/amneziawg-linux-kernel-module-master/src/* /usr/src/amneziawg-1.0.20241112/
  args:
    creates: /usr/src/amneziawg-1.0.20241112/Makefile

- name: Create dkms.conf
  copy:
    content: |
      PACKAGE_NAME="amneziawg"
      PACKAGE_VERSION="1.0.20241112"
      BUILT_MODULE_NAME[0]="amneziawg"
      DEST_MODULE_LOCATION[0]="/kernel/drivers/net/amneziawg"
      AUTOINSTALL="yes"
      MAKE="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
      CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
    dest: /usr/src/amneziawg-1.0.20241112/dkms.conf
    mode: 0644

- name: Add DKMS module
  shell: dkms add amneziawg/1.0.20241112
  args:
    creates: /var/lib/dkms/amneziawg/1.0.20241112/source

- name: Build DKMS module
  shell: dkms build amneziawg/1.0.20241112
  args:
    creates: /var/lib/dkms/amneziawg/1.0.20241112/build/amneziawg.ko

- name: Install DKMS module
  shell: dkms install amneziawg/1.0.20241112
  args:
    creates: /lib/modules/{{ ansible_kernel }}/updates/dkms/amneziawg.ko.zst

- name: Load amneziawg module now
  modprobe:
    name: amneziawg
    state: present

- name: Load amneziawg module on boot
  copy:
    content: "amneziawg\n"
    dest: /etc/modules-load.d/amneziawg.conf
    mode: 0644

- name: Reload systemd
  systemd:
    daemon_reload: yes

# === awg0 — сервер для клиентов ===

- name: Generate awg0 server private key
  shell: awg genkey
  register: awg0_priv_raw
  changed_when: false

- name: Set awg0 private key
  set_fact:
    awg0_private_key: "{{ awg0_priv_raw.stdout }}"

- name: Generate awg0 server public key
  shell: echo "{{ awg0_private_key }}" | awg pubkey
  register: awg0_pub_raw
  changed_when: false

- name: Set awg0 public key
  set_fact:
    awg0_public_key: "{{ awg0_pub_raw.stdout }}"

- name: Save awg0 server credentials
  copy:
    content: |
      awg0_private_key: {{ awg0_private_key }}
      awg0_public_key: {{ awg0_public_key }}
    dest: /etc/amnezia/amneziawg/awg0-server-credentials.txt
    mode: 0600

- name: Deploy awg0 server config
  template:
    src: awg0.conf.j2
    dest: /etc/amnezia/amneziawg/awg0.conf
    mode: 0600

# === awg1 — клиент к Moldova ===

- name: Generate awg1 client private key
  shell: awg genkey
  register: awg1_priv_raw
  changed_when: false

- name: Set awg1 private key
  set_fact:
    awg1_private_key: "{{ awg1_priv_raw.stdout }}"

- name: Generate awg1 client public key
  shell: echo "{{ awg1_private_key }}" | awg pubkey
  register: awg1_pub_raw
  changed_when: false

- name: Set awg1 public key
  set_fact:
    awg1_public_key: "{{ awg1_pub_raw.stdout }}"

- name: Generate PSK for Moldova
  shell: awg genpsk
  register: awg1_psk_raw
  changed_when: false

- name: Set PSK fact
  set_fact:
    awg1_psk: "{{ awg1_psk_raw.stdout }}"

- name: Save awg1 client credentials
  copy:
    content: |
      awg1_private_key: {{ awg1_private_key }}
      awg1_public_key: {{ awg1_public_key }}
      awg1_psk: {{ awg1_psk }}
    dest: /etc/amnezia/amneziawg/awg1-client-credentials.txt
    mode: 0600

- name: Deploy awg1 client config
  template:
    src: awg1.conf.j2
    dest: /etc/amnezia/amneziawg/awg1.conf
    mode: 0600

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Enable awg0 (server)
  systemd:
    name: awg-quick@awg0
    enabled: yes
    state: started

- name: Enable awg1 (client to Moldova) — not started, peer needed first
  systemd:
    name: awg-quick@awg1
    enabled: yes
    state: stopped

- name: Setup routing rule (will activate when awg1 is up)
  copy:
    content: |
      #!/bin/bash
      sleep 5
      ip rule add from 10.88.88.0/24 lookup 200 priority 100 2>/dev/null || true
      ip route add default dev awg1 table 200 2>/dev/null || true
      exit 0
    dest: /etc/rc.local
    mode: 0755
