---
- name: sovrn-bt installed
  ansible.builtin.copy:
    src: "{{ sovereign_repo }}/infrastructure/exit/sovrn-bt"
    dest: /usr/local/sbin/sovrn-bt
    owner: root
    group: root
    mode: "0755"
  register: exit_bt_script

- name: AmneziaWG config directory
  ansible.builtin.file:
    path: /etc/amnezia/amneziawg
    state: directory
    owner: root
    group: root
    mode: "0700"

# diff: false — the file carries the link's private key and PSK.
- name: Link configs
  ansible.builtin.template:
    src: link.conf.j2
    dest: "/etc/amnezia/amneziawg/{{ item.if }}.conf"
    owner: root
    group: root
    mode: "0600"
  diff: false
  loop: "{{ exit_links }}"
  loop_control:
    label: "{{ item.if }} <- {{ item.name }}"
  register: exit_link_conf
  tags: [keyfiles]

# Before the restart: the port has to be open when the link comes back.
- name: Link ports open, each to its entry only
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.from }}"
    to_port: "{{ item.port | string }}"
    proto: udp
    comment: "{{ item.if }} link from {{ item.name }}"
  loop: "{{ exit_links }}"
  loop_control:
    label: "{{ item.if }} :{{ item.port }} from {{ item.name }}"

- name: Links enabled and running
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item.if }}"
    enabled: true
    state: started
  loop: "{{ exit_links }}"
  loop_control:
    label: "{{ item.if }}"

# Not a handler: only the links whose file changed are bounced, or every link
# when sovrn-bt changed (its rules are built on PostUp). A link carries one
# entry's clients; a restart drops them for a second.
- name: Changed links restarted
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item.item.if }}"
    state: restarted
  loop: "{{ exit_link_conf.results }}"
  loop_control:
    label: "{{ item.item.if }}"
  when: item is changed or exit_bt_script is changed

# After a restart the exit no longer knows the entry's address and cannot
# start a handshake itself: the entry does, once its keepalives go
# unanswered (seen to take 15-40 s). Waited for here so verify.yml does not
# report a link that is merely coming back (exit-2, 2026-10-24).
- name: Restarted links have a handshake again
  ansible.builtin.shell: |
    set -o pipefail
    awg show {{ item.item.if }} latest-handshakes | awk -v n="$(date +%s)" '{print n - $2}'
  args:
    executable: /bin/bash
  register: exit_link_hs
  until: (exit_link_hs.stdout | default('', true) | trim or '999999') | int < 180
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false
  loop: "{{ exit_link_conf.results }}"
  loop_control:
    label: "{{ item.item.if }}"
  when:
    - item is changed or exit_bt_script is changed
    - not ansible_check_mode
