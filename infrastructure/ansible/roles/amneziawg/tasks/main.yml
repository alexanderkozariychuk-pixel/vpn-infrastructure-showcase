- name: Install AmneziaWG (using official script)
  include_tasks: install.yml
  when: awg_install | default(true)


- name: Generate private and public keys if not provided
  block:
    - name: Generate a new private key
      shell: awg genkey
      register: generated_private_key
      when: awg_private_key is not defined or awg_private_key == ""

    - name: Set private key fact
      set_fact:
        awg_private_key: "{{ generated_private_key.stdout }}"
      when: awg_private_key is not defined or awg_private_key == ""

    - name: Generate public key from the private key
      shell: echo "{{ awg_private_key }}" | awg pubkey
      register: generated_public_key
      when: awg_public_key is not defined or awg_public_key == ""

    - name: Set public key fact
      set_fact:
        awg_public_key: "{{ generated_public_key.stdout }}"
      when: awg_public_key is not defined or awg_public_key == ""

  when: awg_generate_keys | default(true)


- name: Create AmneziaWG config directory
  file:
    path: /etc/amnezia/amneziawg
    state: directory
    mode: 0700

- name: Deploy awg0.conf from template
  template:
    src: awg0.conf.j2
    dest: /etc/amnezia/amneziawg/awg0.conf
    mode: 0600
  notify: restart awg

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Enable NAT for exit node
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ ansible_default_ipv4.interface }}"
    jump: MASQUERADE
    comment: "AmneziaWG NAT"
  when: awg_enable_nat | default(false)

- name: Save iptables rules (Ubuntu)
  shell: iptables-save > /etc/iptables/rules.v4
  when: awg_enable_nat | default(false) and ansible_os_family == "Debian"

- name: Start and enable AmneziaWG service
  systemd:
    name: awg-quick@awg0
    state: started
    enabled: yes