---
- name: Link to the exit
  when: entry_link is defined
  block:
    # diff: false — the file carries the link's private key and PSK.
    - name: Link config
      ansible.builtin.template:
        src: link.conf.j2
        dest: "/etc/amnezia/amneziawg/{{ entry_link.if }}.conf"
        owner: root
        group: root
        mode: "0600"
      diff: false
      notify: Restart link
      tags: [keyfiles]

    - name: Link enabled and running
      ansible.builtin.systemd_service:
        name: "awg-quick@{{ entry_link.if }}"
        enabled: true
        state: started

    - name: Link port hopping
      when: entry_link.hop_ports is defined
      block:
        - name: Hop ports include the inventory's port
          ansible.builtin.assert:
            that:
              - entry_link.hop_ports | length >= 2
              - entry_link.port | int in (entry_link.hop_ports | map('int') | list)
            fail_msg: "entry_link.hop_ports needs two or more ports, entry_link.port among them"
            quiet: true

        - name: /etc/sovereign exists
          ansible.builtin.file:
            path: /etc/sovereign
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: sovrn-link-hop installed
          ansible.builtin.copy:
            src: "{{ sovereign_repo }}/infrastructure/link/sovrn-link-hop"
            dest: /usr/local/sbin/sovrn-link-hop
            owner: root
            group: root
            mode: "0755"

        - name: sovrn-link-hop config
          ansible.builtin.copy:
            dest: /etc/sovereign/link-hop.conf
            content: |
              # Installed by Ansible (roles/entry). See /usr/local/sbin/sovrn-link-hop.
              IF={{ entry_link.if }}
              PORTS="{{ entry_link.hop_ports | join(' ') }}"
              STALE={{ entry_link_hop_stale }}
              # The slow check: the exit's end of the link against its public
              # address, pinged together (2026-10-29: inside 88 ms, outside 48).
              PROBE_INNER={{ entry_link.peer_address }}
              PROBE_OUTER={{ entry_link.peer_endpoint | regex_replace(':[0-9]+$', '') }}
              SLOW_MS={{ entry_link_hop_slow_ms }}
              SLOW_LOSS={{ entry_link_hop_slow_loss }}
              SLOW_RUNS={{ entry_link_hop_slow_runs }}
              SLOW_COOLDOWN={{ entry_link_hop_slow_cooldown }}
            owner: root
            group: root
            mode: "0644"

        - name: sovrn-link-hop units
          ansible.builtin.copy:
            src: "{{ sovereign_repo }}/infrastructure/link/{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop: [sovrn-link-hop.service, sovrn-link-hop.timer]

        - name: sovrn-link-hop timer on
          ansible.builtin.systemd_service:
            name: sovrn-link-hop.timer
            enabled: true
            state: started
            daemon_reload: true

- name: No link configured yet
  ansible.builtin.debug:
    msg: "entry_link is not set for {{ inventory_hostname }}: client traffic has no route to the exit"
  when: entry_link is not defined
