---
# Interface the entry reaches the internet through; RU-bound client traffic
# is masqueraded out of it.
entry_uplink_if: "{{ ansible_facts['default_ipv4']['interface'] }}"

# Drop traffic from one client to another: by destination (entry_client_nets)
# and awg0 -> awg0. Written into awg0.conf on creation only; an existing
# awg0.conf is edited by hand (docs/entry-spec.md, "Client isolation").
entry_isolate_clients: true

entry_route_table: 200

# Link port hopping (infrastructure/link/sovrn-link-hop), on when
# entry_link.hop_ports is set: seconds without a handshake before the link
# moves to the next source port.
entry_link_hop_stale: 180
entry_conntrack_max: 262144
entry_ru_min_prefixes: 8000

# entry_link (dict) is defined per host once the exit side exists; until then
# the link is not configured. See inventory/hosts.yml.example.

entry_wrappers:
  - pwa-add-peer
  - pwa-del-peer
  - pwa-awg-show
  - pwa-logs

# What awg reports for a parameter it does not print (the protocol default).
entry_awg_obf_defaults:
  jc: "0"
  jmin: "0"
  jmax: "0"
  s1: "0"
  s2: "0"
  s3: "0"
  s4: "0"
  h1: "1"
  h2: "2"
  h3: "3"
  h4: "4"
