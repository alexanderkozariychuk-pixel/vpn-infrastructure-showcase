---
- name: Install Docker dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker and Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start and enable Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add user to docker group
  user:
    name: "{{ new_user }}"
    groups: docker
    append: yes

- name: Create monitoring directory
  file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: 0755

- name: Create subdirectories
  file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: directory
    mode: 0755
  loop:
    - prometheus
    - loki
    - grafana

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: 0644
  notify: restart monitoring

- name: Deploy Prometheus config
  template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    mode: 0644
  notify: restart monitoring

- name: Deploy Loki config
  template:
    src: loki.yml.j2
    dest: "{{ monitoring_dir }}/loki/loki.yml"
    mode: 0644
  notify: restart monitoring

- name: Allow monitoring ports in UFW
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    src: "{{ item.src | default('any') }}"
  loop:
    - { port: "{{ grafana_port }}", src: "any" }
    - { port: "{{ prometheus_port }}", src: "127.0.0.1" }
    - { port: "{{ loki_port }}", src: "any" }

- name: Start monitoring stack
  shell: docker compose up -d
  args:
    chdir: "{{ monitoring_dir }}"