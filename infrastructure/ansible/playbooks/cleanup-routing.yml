---
- name: Infrastructure Cleanup - Legacy Routing and Proxying
  hosts: entry, exit
  become: yes
  gather_facts: yes
  
  tasks:
    # 1. SERVICE DECOMMISSIONING
    - name: Stop and disable legacy proxy services
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop: [tun2socks, shadowsocks-libev]
      when: "'entry' in group_names"

    - name: Stop shadowsocks server on exit node
      systemd:
        name: shadowsocks-libev
        state: stopped
        enabled: false
      failed_when: false
      when: "'exit' in group_names"

    # 2. FILESYSTEM CLEANUP
    - name: Remove legacy service units and binaries
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/tun2socks.service
        - /usr/local/bin/tun2socks-linux-amd64
        - /etc/rc.local  # Removing custom persistence script
      tags: cleanup-files

    # 3. NETWORK INTERFACE CLEANUP
    - name: Remove legacy TUN interface
      shell: |
        ip link set tun0 down 2>/dev/null || true
        ip link delete tun0 2>/dev/null || true
      failed_when: false

    # 4. POLICY ROUTING CLEANUP
    - name: Flush custom routing table 100 and rules
      shell: |
        # Remove rules by priority (50 and 100 used in manual troubleshooting)
        ip rule del priority 50 2>/dev/null || true
        ip rule del priority 100 2>/dev/null || true
        # Remove specific client rules
        ip rule del from 10.66.66.3 lookup 100 2>/dev/null || true
        ip rule del from 10.66.66.6 lookup 100 2>/dev/null || true
        # Clean up the routing table itself
        ip route flush table 100 2>/dev/null || true
      failed_when: false
      tags: cleanup-routing

    # 5. FIREWALL (IPTABLES) ADJUSTMENTS
    - name: Remove manual DNS redirection and MSS clamping
      shell: |
        # Remove DNS hijacking
        iptables -t nat -D PREROUTING -i awg0 -p udp --dport 53 -j DNAT --to-destination 1.1.1.1 2>/dev/null || true
        iptables -t nat -D PREROUTING -i awg0 -p tcp --dport 53 -j DNAT --to-destination 1.1.1.1 2>/dev/null || true
        # Remove manual TCP MSS clamping used for MTU troubleshooting
        iptables -t mangle -D FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1200 2>/dev/null || true
      failed_when: false
      tags: cleanup-iptables

    - name: Force systemd daemon-reload
      systemd:
        daemon_reload: yes