---
# Build or check an entry node (docs/entry-spec.md).
#
# From infrastructure/ansible/:
#
#   ansible-playbook playbooks/entry.yml --limit entry-b -e @~/.sovereign/vault-b.yml --ask-vault-pass
#
# Entry A is not in the inventory: it is changed by hand (README.md).
#
# The last task lists everything the read-only checks found. In check mode
# that list is the answer; in a real run it is fatal.

- name: Entry node
  hosts: entry
  become: true

  pre_tasks:
    # Second fence. A live node (entry A) is not in the inventory at all;
    # if one is ever added to it, it must also be in `live`, and then only
    # a --check run gets past this.
    - name: Hosts in `live` are never changed
      ansible.builtin.assert:
        that: ansible_check_mode or inventory_hostname not in groups.get('live', [])
        fail_msg: "{{ inventory_hostname }} is in the live group: run with --check"
        quiet: true

  roles:
    - common
    - entry

  # After the handlers: sshd has been reloaded, sysctl applied, units started.
  post_tasks:
    - name: Check the base system
      ansible.builtin.include_role:
        name: common
        tasks_from: verify

    - name: Check the entry
      ansible.builtin.include_role:
        name: entry
        tasks_from: verify

    - name: Findings
      ansible.builtin.debug:
        msg: "{{ verify_problems | default([]) if verify_problems | default([]) else 'none' }}"

    - name: Stop on findings (outside check mode)
      ansible.builtin.fail:
        msg: "{{ verify_problems | length }} finding(s) above"
      when:
        - verify_problems | default([]) | length > 0
        - not ansible_check_mode
