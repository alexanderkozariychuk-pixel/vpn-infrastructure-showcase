---
# Values every entry shares. Port, addresses and subnets are the same on
# every entry (the trial net and the wrappers assume them).
# entry_awg0_obfuscation below is cluster 1's (entry A, AmneziaWG 1.0): what
# its client configs carry, also in pwa/services/provisioner.py (AWG_PARAMS).
# An entry of another cluster has its own awg0 key and obfuscation and sets
# entry_awg0_obfuscation and entry_awg0_public_key as host vars, which win
# over this file (since 2026-10-24: entry B, cluster 2, AmneziaWG 3.x).

entry_awg0_port: 8443
entry_awg0_address: 10.88.88.1/24
entry_client_subnet: 10.88.88.0/24
# Every client address: paying 10.88.88.0/24 and trial 10.88.89.0/24. What
# the isolation rule in awg0.conf drops when a client sends to it.
entry_client_nets: 10.88.88.0/23
entry_awg0_obfuscation:
  jc: 3
  jmin: 50
  jmax: 1000
  s1: 72
  s2: 146
  h1: 1163059398
  h2: 1787455160
  h3: 970047041
  h4: 133143559
