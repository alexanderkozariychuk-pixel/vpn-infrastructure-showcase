services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpn_sre
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sovereign

  pwa:
    build: .
    container_name: sovereign-pwa
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sre_user:${POSTGRES_PASSWORD}@postgres:5432/vpn_sre
    volumes:
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
    networks:
      - sovereign

volumes:
  postgres_data:

networks:
  sovereign:
    driver: bridge
