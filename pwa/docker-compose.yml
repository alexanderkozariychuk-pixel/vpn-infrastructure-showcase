services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpn_sre
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d vpn_sre"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sovereign

  pwa:
    build: .
    container_name: sovereign-pwa
    restart: unless-stopped
    env_file: .env
    environment:
      PWA_SSH_DIR: /home/app/.ssh
    # Must be owned by uid 10001 on the host: chown -R 10001:10001 /opt/pwa/ssh_keys
    volumes:
      - /opt/pwa/ssh_keys:/home/app/.ssh:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sovereign

volumes:
  postgres_data:

networks:
  sovereign:
    driver: bridge
