name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible:
    name: Ansible syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Syntax check all playbooks
        run: |
          for playbook in playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook "$playbook" --syntax-check
            echo "::endgroup::"
          done

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./archive/*" \
            -print -exec shellcheck {} +

  python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Errors only: syntax errors and undefined names.
      # Style is deliberately not enforced — this gate exists to catch
      # code that cannot run, not code that reads differently.
      - name: Ruff check
        run: ruff check pwa/ monitoring/ --select E9,F63,F7,F82 --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # The suite covers the webhook boundary: the point where an
      # unauthenticated request turns into a paid subscription. Cases are
      # written around what must be rejected, not around the happy path.
      - name: Run pytest
        run: pytest -q
