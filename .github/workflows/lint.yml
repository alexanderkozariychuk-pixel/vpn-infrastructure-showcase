name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

       # -------------------------------
      # Terraform
      # -------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Cache Terraform plugins
        uses: actions/cache@v3
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infrastructure/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # --- Aeza module ---
      - name: Terraform fmt check (aeza)
        run: |
          cd infrastructure/terraform/aeza
          terraform fmt -check -recursive

      - name: Terraform init (aeza)
        run: |
          cd infrastructure/terraform/aeza
          terraform init -backend=false

      - name: Terraform validate (aeza)
        run: |
          cd infrastructure/terraform/aeza
          terraform validate

      - name: Terraform plan (aeza)
        env:
          AEZA_API_KEY: ${{ secrets.AEZA_API_KEY }}
        run: |
          cd infrastructure/terraform/aeza
          terraform plan -input=false -no-color
        continue-on-error: true  

      # --- Yandex module ---
      - name: Terraform fmt check (yandex)
        run: |
          cd infrastructure/terraform/yandex
          terraform fmt -check -recursive

      - name: Terraform init (yandex)
        run: |
          cd infrastructure/terraform/yandex
          terraform init -backend=false

      - name: Terraform validate (yandex)
        run: |
          cd infrastructure/terraform/yandex
          terraform validate

      - name: Terraform plan (yandex)
        env:
          YC_TOKEN: ${{ secrets.YANDEX_CLOUD_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YANDEX_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          cd infrastructure/terraform/yandex
          terraform plan -input=false -no-color
        continue-on-error: true

      # -------------------------------
      # Ansible
      # -------------------------------
      - name: Install Ansible
        run: pip install ansible

      - name: Ansible syntax check
        run: ansible-playbook infrastructure/ansible/playbooks/site.yml --syntax-check
        
      - name: Ansible syntax check (other playbooks)
        run: |
          for playbook in infrastructure/ansible/playbooks/*.yml; do
            ansible-playbook "$playbook" --syntax-check
          done

      # -------------------------------
      # Shell scripts
      # -------------------------------
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all .sh files
        run: |
          find scripts/ -name "*.sh" -exec shellcheck {} \;

      # -------------------------------
      # Python scripts
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (Python scripts)
        run: ruff check scripts/ --output-format=github