name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The full `ansible` package, not ansible-core: it carries the
      # ansible.posix and community.general collections the roles use.
      - name: Install Ansible
        run: pip install ansible ansible-lint

      - name: Syntax check all playbooks
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          for playbook in playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook "$playbook" --syntax-check
            echo "::endgroup::"
          done

      - name: ansible-lint
        run: ansible-lint playbooks roles

      # The read-only checks, against stubbed commands; each check is seen
      # to fire on a fixture broken in exactly that place.
      - name: Verify-task tests
        working-directory: .
        run: bash tests/infrastructure/test_entry_verify.sh

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./archive/*" -not -path "*/as-found-*" \
            -print -exec shellcheck {} +

  python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Errors only: syntax errors and undefined names.
      # Style is deliberately not enforced — this gate exists to catch
      # code that cannot run, not code that reads differently.
      - name: Ruff check
        run: ruff check pwa/ monitoring/ infrastructure/ --select E9,F63,F7,F82 --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite imports the application — auth guards, the plan table, the
      # provisioning and expiry paths — so it needs the runtime dependencies
      # as well as the tooling. Installing only requirements-dev.txt passed
      # while the tests touched one dependency-free module, then broke the
      # moment they covered anything real.
      - name: Install dependencies
        run: pip install -r pwa/requirements.txt -r requirements-dev.txt

      # Cases are written around what must be rejected rather than the happy
      # path: a client token on an admin route, an expired subscription, a
      # renewal that must not issue a second peer, a webhook signature that
      # does not match, and a price on the pricing page that disagrees with
      # the one the server charges.
      - name: Run pytest
        run: pytest -q
