---
# Assumes AmneziaWG is already installed (via the amneziawg role's install.yml
# on at least one node in the pair). This role only deploys the second,
# backbone interface (awg1) used purely for server-to-server transport.
#
# IMPORTANT: bb_fwmark must differ from the client-facing awg0's fwmark —
# reusing fwmarks across interfaces causes policy-routing collisions.
#
# IMPORTANT: on the initiator side, do NOT let wg-quick's automatic policy
# routing take over (which happens whenever AllowedIPs=0.0.0.0/0). Use
# `Table = off` and add scoped routing manually via PostUp/PostDown so only
# client-subnet-sourced traffic uses the tunnel as default route — the
# host's own traffic (SSH, management) keeps using its normal route.
# Lesson from 2026-07-09 (mirrors the earlier Bridge/awg1 SSH-hijack fix).

- name: Ensure AmneziaWG is installed (idempotent, shared install path)
  include_role:
    name: amneziawg
    tasks_from: install

- name: Create AmneziaWG config directory
  file:
    path: /etc/amnezia/amneziawg
    state: directory
    mode: 0700

- name: Deploy backbone interface config ({{ bb_interface }}.conf)
  template:
    src: awg1.conf.j2
    dest: "/etc/amnezia/amneziawg/{{ bb_interface }}.conf"
    mode: 0600
  register: bb_config_deployed

- name: Open backbone UDP port on listener side
  iptables:
    chain: INPUT
    protocol: udp
    destination_port: "{{ bb_listen_port }}"
    jump: ACCEPT
    comment: "AmneziaWG backbone tunnel"
  when: bb_role == 'listener'

# --- Exit-node NAT: on the listener (Frankfurt) side, client subnet traffic
# arriving over the backbone tunnel needs to egress to the internet via the
# real interface. ---
# TODO: the template now also supports PostUp/PostDown rules (bb_post_up).
# NAT must come from ONE source, not both — duplicated MASQUERADE rules were
# observed in production exactly because a rule arrived from two places.
# Resolve before this role is applied again.
- name: Enable NAT for client subnet egress (listener/exit side only)
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ bb_client_subnet }}"
    out_interface: "{{ ansible_default_ipv4.interface }}"
    jump: MASQUERADE
    comment: "AmneziaWG backbone client egress NAT"
  when: bb_role == 'listener' and bb_client_subnet is defined

- name: Save iptables rules (persist NAT across reboot)
  shell: iptables-save > /etc/iptables/rules.v4
  when: bb_role == 'listener' and bb_client_subnet is defined

- name: Ensure backbone tunnel is enabled at boot
  systemd:
    name: "awg-quick@{{ bb_interface }}"
    enabled: yes

# Explicit restart-if-config-changed instead of relying on `state: started`,
# which is a no-op if systemd already considers the (oneshot) unit active —
# even when the config file changed. This was the actual cause of a
# connectivity check passing against a STALE tunnel. Lesson from 2026-07-09.
- name: Restart backbone tunnel to apply current config
  systemd:
    name: "awg-quick@{{ bb_interface }}"
    state: restarted
  when: bb_config_deployed.changed

- name: Ensure backbone tunnel is running (first-time start, config unchanged case)
  systemd:
    name: "awg-quick@{{ bb_interface }}"
    state: started
  when: not bb_config_deployed.changed

# --- Safety net: verify the host is still reachable and the tunnel actually
# passes traffic, AFTER the restart above (not before). ---
- name: Wait a moment for the tunnel to settle
  ansible.builtin.pause:
    seconds: 3

- name: Verify outbound connectivity from this host still works
  ansible.builtin.shell: "ping -c 2 -W 3 1.1.1.1"
  register: connectivity_check
  changed_when: false
  failed_when: connectivity_check.rc != 0

- name: Verify backbone peer is reachable over the tunnel (initiator only)
  ansible.builtin.shell: "ping -c 3 -W 3 {{ bb_peer_tunnel_ip }}"
  register: peer_check
  changed_when: false
  failed_when: peer_check.rc != 0
  when: bb_role == 'initiator' and bb_peer_tunnel_ip is defined
